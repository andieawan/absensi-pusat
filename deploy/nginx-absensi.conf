# Nginx untuk Absensi Siswa. Salin ke /etc/nginx/sites-available/absensi lalu ganti:
#   absensi.sekolah.sch.id → domain/IP server Anda
#   /var/www/absensi       → folder aplikasi (yang berisi artisan)
#   php8.3-fpm.sock        → sesuai versi PHP (php8.4-fpm.sock dst.)
server {
    listen 80;
    listen [::]:80;
    server_name absensi.sekolah.sch.id;

    root /var/www/absensi/public;
    index index.php;
    charset utf-8;

    client_max_body_size 10M;   # unggah scan surat (maks. 8 MB) & berkas impor

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Service worker harus selalu segar
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Jangan layani berkas tersembunyi (.env, .git, dst.)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }

    access_log /var/log/nginx/absensi.access.log;
    error_log  /var/log/nginx/absensi.error.log;
}
