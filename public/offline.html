<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Tidak ada koneksi · Absensi Siswa</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;text-align:center}
img{width:64px;height:64px}h1{font-size:19px;margin:12px 0 6px}p{color:#64748b;margin:0 0 16px}
button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <img src="icons/icon-192.png" alt="">
  <h1>Tidak ada koneksi internet</h1>
  <p>Absensi dan nilai disimpan langsung ke server sekolah, jadi perlu internet. Periksa koneksi Wi-Fi atau data seluler, lalu coba lagi. Kalau tadi sedang menyimpan absensi atau nilai, cek kembali setelah online apakah sudah tersimpan.</p>
  <button onclick="location.reload()">Coba Lagi</button>
</div>
</body>
</html>
